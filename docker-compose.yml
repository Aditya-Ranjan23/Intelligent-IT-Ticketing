version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: it_tickets_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: it_ticketing
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d it_ticketing"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: it_tickets_redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: it_tickets_api
    restart: always
    ports:
      - "8000:8000"
    environment:
      POSTGRES_URI: postgresql://postgres:postgres@postgres:5432/it_ticketing
      REDIS_URL: redis://redis:6379/0
      CONFIDENCE_THRESHOLD: "0.72"
      CACHE_SIMILARITY_THRESHOLD: "0.82"
      STORE_PLAYBOOK_HITS: "true"
      EMBEDDING_MODEL_NAME: "all-MiniLM-L6-v2"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
